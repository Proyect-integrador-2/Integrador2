apiVersion: 1

# Misma fuente que en infra/lab-local (uid "zabbix", el que usan los cinco tableros),
# apuntando al Zabbix del laboratorio con el usuario de solo lectura.
datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: $ZABBIX_API_URL
    isDefault: true
    editable: true
    jsonData:
      username: $ZABBIX_API_USER
      trends: true
      trendsFrom: 7d
      trendsRange: 4d
      cacheTTL: 1m
    secureJsonData:
      password: $ZABBIX_API_PASSWORD
