    - host: msmotos-web
      name: 'MS Motos (aplicación)'
      groups:
        - name: 'Integrador II'
      items:
        - name: 'Disponibilidad de la app'
          type: CALCULATED
          key: app.disponibilidad
          delay: 30s
          value_type: FLOAT
          units: '%'
          params: '100*(last(//web.test.fail[App MS Motos])=0)'
          tags:
            - tag: component
              value: aplicacion
      httptests:
        - name: 'App MS Motos'
          delay: 30s
          steps:
            - name: health
              url: 'https://10.10.30.11/api/health'
              timeout: 5s
              required: '"ok":true'
              status_codes: '200'
            - name: frontend
              url: 'https://10.10.30.11/'
              timeout: 5s
              required: app-root
              status_codes: '200'
      tags:
        - tag: capa
          value: aplicacion
      inventory_mode: DISABLED
    - host: msmotos-web-win
