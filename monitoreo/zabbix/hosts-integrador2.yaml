          type: DEPENDENT
          key: ip2.cert.dias
          delay: '0'
          units: días
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.x509.not_after.timestamp
            - type: JAVASCRIPT
              parameters:
                - 'return Math.floor((Number(value) - Date.now() / 1000) / 86400);'
          master_item:
            key: 'web.certificate.get[10.10.30.11,443]'
          tags:
            - tag: component
              value: certificado
          triggers:
            - expression: last(/vm-app/ip2.cert.dias)<15
              name: 'T20 Certificado HTTPS de la aplicación por vencer (menos de 15 días)'
              opdata: 'quedan {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Renovarlo con infra/proxmox/ca-interna.sh en el servidor Proxmox.'
              tags:
                - tag: capa
                  value: seguridad
                - tag: remediation
                  value: none
        - name: 'SSH: intento fallido'
          type: ZABBIX_ACTIVE
          key: 'log[/var/log/auth.log,"sshd.*(Failed password|Invalid user|authentication failure|Connection closed by invalid user)",,,skip]'
          delay: 30s
          value_type: LOG
          trends: '0'
          tags:
