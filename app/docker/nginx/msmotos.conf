# Nginx de la VM de aplicación (servicio del sistema, no contenedor).
# Instalar en: /etc/nginx/sites-available/msmotos.conf
#   sudo ln -s /etc/nginx/sites-available/msmotos.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS con el certificado de la autoridad interna del laboratorio (IP2-90), que deja
# infra/proxmox/ca-interna.sh en /etc/nginx/ssl/. El puerto 80 solo redirige a HTTPS.

upstream msmotos_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Métricas de Nginx para la plantilla "Nginx by Zabbix agent".
    # Solo desde la propia VM (el agente consulta 127.0.0.1).
    location = /basic_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/msmotos.access.log;
    error_log  /var/log/nginx/msmotos.error.log warn;
}

server {
    # "http2" en el listen: el Nginx de Ubuntu 24.04 (1.24) todavía no tiene la directiva "http2 on".
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/msmotos.crt;
    ssl_certificate_key /etc/nginx/ssl/msmotos.key;
    # Solo versiones y cifrados actuales.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MSMOTOS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    # Las cabeceras de seguridad (HSTS, CSP, X-Frame-Options, nosniff, Referrer-Policy,
    # Permissions-Policy) las pone la aplicación (backend/src/server.js): no se repiten aquí.

    # Las fotos de órdenes viajan en base64 dentro del JSON (Express acepta 10 MB).
    client_max_body_size 12m;

    location / {
        proxy_pass http://msmotos_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # server.js confía en el primer proxy: req.ip será la IP real del cliente
        # (la usan el rate limiting y los logs).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Si el contenedor está caído, Nginx responde 502: es lo que ve el usuario (y el RPA).
    access_log /var/log/nginx/msmotos.access.log;
    error_log  /var/log/nginx/msmotos.error.log warn;
}
