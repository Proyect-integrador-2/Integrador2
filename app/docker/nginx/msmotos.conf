# Nginx de la VM de aplicación (servicio del sistema, no contenedor).
# Instalar en: /etc/nginx/sites-available/msmotos.conf
#   sudo ln -s /etc/nginx/sites-available/msmotos.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream msmotos_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Las fotos de órdenes viajan en base64 dentro del JSON (Express acepta 10 MB).
    client_max_body_size 12m;

    # Métricas de Nginx para la plantilla "Nginx by Zabbix agent".
    # Solo desde la propia VM (el agente consulta 127.0.0.1).
    location = /basic_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
        access_log off;
    }

    location / {
        proxy_pass http://msmotos_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # server.js confía en el primer proxy: req.ip será la IP real del cliente
        # (la usan el rate limiting y los logs).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Si el contenedor está caído, Nginx responde 502: es lo que ve el usuario (y el RPA).
    access_log /var/log/nginx/msmotos.access.log;
    error_log  /var/log/nginx/msmotos.error.log warn;
}
